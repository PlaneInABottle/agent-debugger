[package]
name = "agent-debugger"
version = "0.2.0"
edition = "2021"
# MSRV floor: std File::try_lock / TryLockError stabilized in 1.89.
# Enforced by the CI msrv job (dtolnay/rust-toolchain@1.89, cargo test).
rust-version = "1.89"
description = "Headless, snapshot-first multi-language debugger for AI agents and terminal workflows"
authors = ["PlaneInABottle <mirza.altay@protonmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/PlaneInABottle/agent-debugger"
homepage = "https://github.com/PlaneInABottle/agent-debugger"
keywords = ["debugger", "agent", "headless", "dap", "cdp"]
categories = ["development-tools::debugging", "command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
