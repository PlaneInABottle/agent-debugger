name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/agent-debugger"
          ARCHIVE_NAME="agent-debugger-${{ matrix.target }}.tar.gz"
          chmod +x "$BIN_PATH"
          tar -czvf "$ARCHIVE_NAME" -C "target/${{ matrix.target }}/release" agent-debugger
          shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ARCHIVE_NAME="agent-debugger-${{ matrix.target }}.zip"
          cd "target/${{ matrix.target }}/release"
          7z a "../../../$ARCHIVE_NAME" agent-debugger.exe
          cd ../../..
          shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            agent-debugger-${{ matrix.target }}.*

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          merge-multiple: true

      - name: Generate unified SHA256 checksums
        shell: bash
        run: |
          sha256sum agent-debugger-*.tar.gz agent-debugger-*.zip > SHA256SUMS.txt || true
          ls -la agent-debugger-* SHA256SUMS.txt

      - name: Determine tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            agent-debugger-*.tar.gz
            agent-debugger-*.zip
            agent-debugger-*.sha256
            SHA256SUMS.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM (if NPM_TOKEN is provided)
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public
