name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows runs the same canonical unit gate under Git Bash
        # (.gitattributes pins LF for *.sh; unix-only tests self-gate
        # via #[cfg(unix)] / win32-skip with reason).
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Canonical unit gates
        shell: bash
        run: scripts/run_gates.sh --unit

  live:
    name: Live (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Daemon-backed integration across py/node/java/browser on the
    # runner's toolchains (Chrome is preinstalled on ubuntu images;
    # find_chrome() discovers google-chrome there, macOS path locally).
    # First run provisions venv/debugpy + ws over the network, then the
    # suites run isolated HOME copies — never the real ~/.agent-debugger.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Canonical live gates
        shell: bash
        run: scripts/run_gates.sh --live

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.89 toolchain
        uses: dtolnay/rust-toolchain@1.89

      - name: Cargo test on the MSRV floor
        run: cargo test
