name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows runs the same canonical unit gate under Git Bash
        # (.gitattributes pins LF for *.sh; unix-only tests self-gate
        # via #[cfg(unix)] / win32-skip with reason).
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Canonical unit gates
        shell: bash
        run: scripts/run_gates.sh --unit

  live:
    name: Live (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Daemon-backed integration across py/node/java/browser on the
    # runner's toolchains (Chrome is preinstalled on ubuntu images;
    # find_chrome() discovers google-chrome there, macOS path locally).
    # First run provisions venv/debugpy + ws over the network, then the
    # suites run isolated HOME copies — never the real ~/.agent-debugger.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Warm adapter dependencies (py venv/debugpy, node ws)
        # Live suites copy these real-HOME deps into isolated HOMEs and
        # skip without them (`existing dependency required`), so a clean
        # runner must provision first: one parked start per adapter (the
        # first run installs over the network), then close. The final
        # test fails the step loudly instead of an all-skipped live run.
        shell: bash
        run: |
          cargo build
          ./target/debug/agent-debugger --session ci-warm-py py start examples/py-demo/app.py --break 'examples/py-demo/app.py:26' --timeout 60
          ./target/debug/agent-debugger --session ci-warm-py close
          ./target/debug/agent-debugger --session ci-warm-node node start examples/node-demo/calc.js --break 'examples/node-demo/calc.js:2' --timeout 60
          ./target/debug/agent-debugger --session ci-warm-node close
          test -d ~/.agent-debugger/adapters/python/venv || { echo "python venv not provisioned"; exit 1; }
          test -d ~/.agent-debugger/adapters/node/node_modules || { echo "node ws not provisioned"; exit 1; }

      - name: Canonical live gates
        # Pressure sampler rides THIS step's process group (a separate
        # step's background subshell is reaped when that step ends, which
        # is why the first placement uploaded nothing): free/vmstat/load
        # for the wall-clock-timeout family, uploaded on failure.
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/pressure"
          (while true; do
             echo "=== $(date -u +%FT%TZ) ==="
             free -m || true
             echo "--- vmstat ---"
             vmstat 1 2 | tail -n 2 || true
             echo "--- load ---"
             cat /proc/loadavg || true
             sleep 20
           done > "${RUNNER_TEMP}/pressure/pressure.log" 2>&1 &)
          scripts/run_gates.sh --live

      - name: Upload live failure bundles
        # The harness copies bridge.log/session.json/error.json/stops.json
        # for failed sessions into a stable dir (temp HOME vanishes on
        # process exit). Ships the next failure's forensics with it.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-failure-bundles
          path: |
            ${{ runner.temp }}/live-failure-bundles/
            /tmp/live-failure-bundles/
            ${{ runner.temp }}/pressure/
          if-no-files-found: ignore
          retention-days: 7

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.89 toolchain
        uses: dtolnay/rust-toolchain@1.89

      - name: Cargo test on the MSRV floor
        run: cargo test
